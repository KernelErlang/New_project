[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nocturne-codex"
version = "1.0.0"
description = "A gothic, tarot-driven private grimoire for daily notes: draw five, keep three, and let the cards rewrite the rules."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["notes", "tarot", "journal", "gothic", "privacy", "local-first"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Web Environment",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: News/Diary",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5"]

[project.scripts]
nocturne = "nocturne.cli:main"

[tool.setuptools.packages.find]
include = ["nocturne*"]

[tool.setuptools.package-data]
nocturne = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: tests that start a real server or run many draws"]

[tool.coverage.run]
source = ["nocturne"]
omit = ["nocturne/__main__.py"]

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["nocturne/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # gothic glyphs, em dashes and curly quotes are intentional
  "UP006", "UP035",              # keep typing imports that work on Python 3.9
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "PT018", "PT006", "PT007"]
